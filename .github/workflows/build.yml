---
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        name: Cache Pods
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}

      - name: Install Pods
        run: pod install

      # The committed plist has a placeholder API key, and Firebase aborts at launch without the real one.
      - name: Add Firebase Config
        id: firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set; building without publishing a QA artifact."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "ContentApp/Supporting Files/GoogleService-Info.plist"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Ad-hoc signing embeds the App Group entitlement the app needs at launch.
      - name: Build for Simulator
        run: |
          xcodebuild build \
            -workspace ContentApp.xcworkspace \
            -scheme ContentApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=-

      - name: Package App
        if: steps.firebase.outputs.configured == 'true'
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ContentApp.app" ContentApp-simulator.zip

      - name: Store Artifact
        if: steps.firebase.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContentApp-simulator-${{ github.run_number }}
          path: ContentApp-simulator.zip
          if-no-files-found: error
